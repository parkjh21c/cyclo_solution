handover_demo:
  ros__parameters:
    demo:
      max_retries: 2       # Additional attempts for fresh perception / pre-motion pick planning.
      retry_delay: 1.0     # Seconds before re-acquiring observations.
      pick_timeout: 180.0 # Perception, IK search, close and lift; initialization is a separate stage.
      withdraw_cup: false # true: lift both hands out of the cup after release, before PICK_CUP.
    # /pour_cup: targets from the latest /demo/basket_pose (wrist_basket_init), right-hand hold.
    pour:
      angle_deg: 130.0        # Tilt commanded (cup mouth up = 0).
      fallback_angles_deg: [115.0, 100.0] # Tried in order when a tilt fails to plan before moving
                              # (wrist joint 6 limit at some basket spots); 90 or more.
      design_angle_deg: 130.0 # Tilt at which the lip sits over the target.
      hand_yaw_deg: -90.0     # Hand turned about the cup axis; -90 points the right hand forward.
      direction_deg: 90.0     # Lip toward +y: pours right to left.
      shift: -0.05            # Lip 5 cm right of the basket center (negative = against direction).
      clearance: 0.09         # Lip above the wall top; 0.09 keeps the whole cup above the walls
                              # (no lowering into the basket, any basket yaw). 0.05 hit a wall.
      approach_margin: 0.03   # Upright cup bottom above the wall top while moving over.
      wall_height: 0.08       # Wall top above the measured basket pose (scene walls 0.08).
      lip_radius: 0.043       # Real cup radius at the rim.
      axis_behind_tcp: 0.04   # Cup axis behind the right TCP at the transfer hold.
      grasp_height: 0.12      # Right TCP above the cup bottom at the transfer hold.
      hold_duration: 2.0
      lin_speed: 0.08
      ptp_speed: 0.2
      hold_tolerance: 0.02    # Right TCP distance from the transfer hold allowed at start.
      inner_length: 0.295     # Basket inside at the rim (ffw_grasp basket_inner_top).
      inner_width: 0.21
      inner_margin: 0.03      # Lip target kept this far inside the rim for any basket yaw.
    motion_sequences:
      # From ai_worker origin/feature-demo:
      # ffw_bringup/config/ffw_sg2_rev1_follower/ffw_sg2_follower_custom_positions.yaml
      initial_pose:
        steps: [open_left, open_right, observe_robot]
        open_left:
          type: gripper
          arm: left
          target: [0.0]
          duration: 0.6
          timeout: 12.0
        open_right:
          type: gripper
          arm: right
          target: [0.0]
          duration: 0.6
          timeout: 12.0
        observe_robot:
          type: joint_group
          group: initial_pose
          joint_names: [arm_l_joint1, arm_l_joint2, arm_l_joint3, arm_l_joint4, arm_l_joint5, arm_l_joint6, arm_l_joint7,
                        arm_r_joint1, arm_r_joint2, arm_r_joint3, arm_r_joint4, arm_r_joint5, arm_r_joint6, arm_r_joint7,
                        lift_joint, head_joint1, head_joint2]
          target: [1.05, 0.0, 0.0, -2.27, 0.0, 0.35, 0.0,
                   1.05, 0.0, 0.0, -2.27, 0.0, 0.35, 0.0,
                   -0.1, 0.69, 0.0]
          tolerance: 0.01
          planning_tolerance: 0.001
          velocity_scale: 0.35
          acceleration_scale: 0.35
          timeout: 45.0
