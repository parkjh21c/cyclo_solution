# This robot's calibration (right arm, right wrist D405, printed finger extensions), kept apart
# from the task files; grasp_planner and ffw_pick read it after the task file, so it wins
/**:
  ros__parameters:
    # The shared demo URDF places gripper_r_tcp 45 mm beyond the original
    # end_effector_r_link. It is already the fingertip: never add 45 mm twice.
    tip_below_end_effector: 0.0
    camera_z_bias: 0.012  # wrist_table_init 2026-11-10: right wrist table 0.732 vs tape 0.720 (was 0.016)
    arm_z_bias: 0.005  # G3 ruler at hover vs FK: 0.720 + 0.125 - (0.835 + 0.005); was 0.010 when
    # the FK tip used 5 cm fingers (same command when vertical, tilted tips ~3 mm off the robot)
    camera_x_bias: 0.0
    camera_y_bias: 0.0
