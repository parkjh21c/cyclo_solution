name: Commit history page

# Builds tools/commit_history into a static page from every branch's git log
# and publishes it with GitHub Pages (Settings > Pages > Source: GitHub Actions).
on:
  push:
    branches: [demo-1f]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: commit-history-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history of every branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the history page
        run: >
          python3 tools/commit_history/build_history.py
          --out _site
          --default-branch "${GITHUB_REF_NAME}"
          --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
